[project]
name = "nomad-travel-planner-mcp"
version = "0.1.0"
description = "MCP server for nomad itinerary planning with live flight, accommodation, Tripadvisor, and nomad city-signal data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "agentmail>=0.5.0"
]

[project.scripts]
nomad-travel-mcp = "nomad_travel_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nomad_travel_mcp"]
